<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Porco Flies</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3CclipPath id='r'%3E%3Crect x='2' y='2' width='60' height='60' rx='14'/%3E%3C/clipPath%3E%3Cg clip-path='url(%23r)'%3E%3Crect x='2' y='2' width='60' height='60' fill='%23f6f6f0'/%3E%3Crect x='2' y='2' width='20' height='60' fill='%23009246'/%3E%3Crect x='42' y='2' width='20' height='60' fill='%23c81020'/%3E%3C/g%3E%3Crect x='2' y='2' width='60' height='60' rx='14' fill='none' stroke='%237a1010' stroke-width='4'/%3E%3C/svg%3E">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000;touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
canvas{display:block;width:100%;height:100%}
#mute{position:fixed;top:12px;right:12px;z-index:10;width:40px;height:40px;border:none;border-radius:50%;background:rgba(255,255,255,0.25);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);cursor:pointer;color:#fff;-webkit-tap-highlight-color:transparent;padding:0}
#mute svg{width:22px;height:22px;fill:#fff;pointer-events:none}
#mute.muted svg.mute-on{display:none}
#mute:not(.muted) svg.mute-off{display:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="mute" aria-label="Mute">
  <svg class="mute-on" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
  <svg class="mute-off" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/><line x1="4" y1="4" x2="20" y2="20" stroke="#fff" stroke-width="2"/></svg>
</button>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W, H, horizonY;
const PLANE_SIZE = 0.045;
let planeScale;
let worldOffset = 0;
let planeX, planeY;
let planeVX = 0, planeVY = 0;
let planeAngle = 0;
let propAngle = 0;
let dayTime = 0.15;
let lastTime = 0;

const SCROLL_BASE = 55;
const PLANE_SPEED = 750;
const PLANE_FRICTION = 0.92;
const DAY_CYCLE = 160;
const WORLD_WIDTH_MULT = 5;

// Storybook serif stack (zero-download Ghibli warmth: Palatino on
// macOS/iOS/Windows, Georgia/DejaVu Serif fallback on Linux)
const FONT_STORY = '"Palatino Linotype", Palatino, "Book Antiqua", Georgia, "DejaVu Serif", serif';

const keys = {};
const touch = { active: false, x: 0, y: 0, startX: 0, startY: 0, id: null };

const cloudTemplates = [
  [{x:0,y:-2,r:20},{x:16,y:-8,r:16},{x:-12,y:4,r:13},{x:28,y:0,r:11},{x:8,y:-18,r:12}],
  [{x:0,y:0,r:26},{x:20,y:-12,r:22},{x:-18,y:6,r:19},{x:38,y:-4,r:15},{x:-32,y:8,r:13},{x:10,y:-24,r:14}],
  [{x:0,y:0,r:30},{x:26,y:-14,r:27},{x:-22,y:8,r:23},{x:48,y:-7,r:21},{x:-40,y:10,r:17},{x:14,y:-30,r:18},{x:-8,y:-22,r:14},{x:36,y:-20,r:13}],
  [{x:0,y:0,r:16},{x:12,y:-5,r:12},{x:-9,y:3,r:10},{x:22,y:-2,r:9}],
  [{x:0,y:0,r:34},{x:30,y:-16,r:30},{x:-26,y:9,r:26},{x:55,y:-9,r:24},{x:-46,y:12,r:20},{x:16,y:-32,r:20},{x:-12,y:-24,r:16},{x:42,y:-22,r:14},{x:-35,y:-16,r:12}],
  [{x:0,y:0,r:22},{x:18,y:-10,r:20},{x:-16,y:5,r:17},{x:34,y:-3,r:14},{x:-28,y:7,r:12},{x:8,y:-22,r:15},{x:24,y:-16,r:11}],
];

let farClouds = [];
let nearClouds = [];
let islands = [];
let sparkles = [];
let wavePhase = 0;
let boats = [];
let boatSpawnTimer = 0;
let ginaIslandCounter = 0;
let ginaActive = false;

function generateClouds(arr, count, yMin, yMax, scaleMin, scaleMax, opacityMin, opacityMax) {
  const ww = W * WORLD_WIDTH_MULT;
  for (let i = 0; i < count; i++) {
    arr.push({
      wx: Math.random() * ww,
      y: yMin + Math.random() * (yMax - yMin),
      template: Math.floor(Math.random() * cloudTemplates.length),
      scale: scaleMin + Math.random() * (scaleMax - scaleMin),
      opacity: opacityMin + Math.random() * (opacityMax - opacityMin),
      warmth: (Math.random() - 0.5) * 0.4,
    });
  }
}

function generateIslands() {
  const ww = W * WORLD_WIDTH_MULT;
  const count = Math.max(7, Math.floor(W / 180));
  for (let i = 0; i < count; i++) {
    const w = 120 + Math.random() * 230;
    const h = 30 + Math.random() * 55;
    const trees = [];
    const treeCount = 8 + Math.floor(Math.random() * 12);
    for (let t = 0; t < treeCount; t++) {
      trees.push({
        x: (Math.random() - 0.5) * w * 0.7,
        y: -Math.random() * h * 0.7,
        r: 2 + Math.random() * 4,
        shade: Math.floor(Math.random() * 4),
      });
    }
    const rocks = [];
    const rockCount = 4 + Math.floor(Math.random() * 6);
    for (let r = 0; r < rockCount; r++) {
      rocks.push({
        x: (Math.random() - 0.5) * w * 0.8,
        y: -Math.random() * 5,
        r: 1.5 + Math.random() * 2.5,
      });
    }
    const dist = Math.random();
    islands.push({ wx: Math.random() * ww, w, h, trees, rocks, dist });
  }
}

function spawnGinaIsland() {
  const ww = W * WORLD_WIDTH_MULT;
  const w = 220;
  const h = 55;
  // No trees behind the hotel: the reference shows only low greenery
  // against the wall (distant cypresses excluded per direction)
  const trees = [];
  const flowers = [];
  for (let f = 0; f < 20; f++) {
    flowers.push({
      x: -w * 0.35 + Math.random() * w * 0.25,
      y: -Math.random() * h * 0.5,
      color: ['#e04040','#e88098','#e8d040','#f0f0e8'][Math.floor(Math.random()*4)],
      r: 1 + Math.random() * 1.5,
    });
  }
  const bushes = [];
  for (let b = 0; b < 6; b++) {
    bushes.push({
      x: -w * 0.38 + Math.random() * w * 0.3,
      y: -Math.random() * h * 0.45,
      r: 3 + Math.random() * 3,
    });
  }
  const vines = [];
  for (let v = 0; v < 8; v++) {
    vines.push({
      x: (Math.random() - 0.5) * w * 0.4,
      y: -h * 0.3 - Math.random() * h * 0.5,
      h: 8 + Math.random() * 15,
    });
  }
  islands.push({
    wx: worldOffset + W + 200 + Math.random() * 100,
    w, h, trees, rocks: [], dist: 0.2,
    isGinaBar: true, flowers, bushes, vines,
  });
  ginaActive = true;
  ginaIslandCounter = 0;
}

function generateSparkles() {
  sparkles = [];
  for (let i = 0; i < 55; i++) {
    sparkles.push({
      x: Math.random(),
      y: Math.random(),
      phase: Math.random() * Math.PI * 2,
      speed: 1.5 + Math.random() * 2.5,
      size: 0.8 + Math.random() * 2.5,
    });
  }
}

function generateWorld() {
  farClouds = [];
  nearClouds = [];
  islands = [];
  // Scale cloud counts with viewport width so per-pixel density stays
  // consistent between phones and desktops (islands already scale in kind)
  const density = W / 1200;
  generateClouds(farClouds, Math.min(64, Math.max(8, Math.round(22 * density))), H * 0.02, H * 0.52, 0.8, 2.0, 0.3, 0.55);
  generateClouds(nearClouds, Math.min(40, Math.max(5, Math.round(14 * density))), H * 0.01, H * 0.55, 1.0, 2.2, 0.5, 0.78);
  generateIslands();
  genW = W; genH = H;
}

function init() {
  resize();
  planeX = W * 0.18;
  planeY = H * 0.35;
  generateWorld();
  generateSparkles();
}

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  horizonY = H * 0.75;
  planeScale = Math.min(W, H) * PLANE_SIZE / 40;
}

function lerpColor(a, b, t) {
  return [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t];
}

function sampleColorStops(stops, phase) {
  phase = ((phase % 1) + 1) % 1;
  for (let i = 0; i < stops.length - 1; i++) {
    if (phase >= stops[i].p && phase <= stops[i+1].p) {
      const t = (phase - stops[i].p) / (stops[i+1].p - stops[i].p);
      return lerpColor(stops[i].c, stops[i+1].c, t);
    }
  }
  return stops[0].c;
}

function rgb(c, mul) {
  mul = mul || 1;
  return `rgb(${c[0]*mul|0},${c[1]*mul|0},${c[2]*mul|0})`;
}
function rgba(c, a) {
  return `rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;
}

const SKY_TOP = [
  {p:0,c:[42,50,85]},{p:0.1,c:[55,110,140]},{p:0.25,c:[70,140,155]},
  {p:0.4,c:[190,100,70]},{p:0.52,c:[50,35,75]},{p:0.7,c:[20,22,50]},
  {p:0.88,c:[38,48,80]},{p:1,c:[42,50,85]},
];
const SKY_BOT = [
  {p:0,c:[75,90,120]},{p:0.1,c:[100,160,165]},{p:0.25,c:[120,185,175]},
  {p:0.4,c:[230,155,85]},{p:0.52,c:[70,45,70]},{p:0.7,c:[32,35,65]},
  {p:0.88,c:[70,82,115]},{p:1,c:[75,90,120]},
];
const SEA_TOP = [
  {p:0,c:[15,30,60]},{p:0.1,c:[18,65,105]},{p:0.25,c:[20,75,120]},
  {p:0.4,c:[90,55,40]},{p:0.52,c:[12,10,30]},{p:0.7,c:[6,10,22]},
  {p:0.88,c:[12,25,50]},{p:1,c:[15,30,60]},
];
const SEA_BOT = [
  {p:0,c:[6,15,35]},{p:0.1,c:[8,35,65]},{p:0.25,c:[8,30,65]},
  {p:0.4,c:[45,30,45]},{p:0.52,c:[4,6,18]},{p:0.7,c:[2,5,14]},
  {p:0.88,c:[5,12,30]},{p:1,c:[6,15,35]},
];
const CLOUD_HIGHLIGHT = [
  {p:0,c:[180,185,195]},{p:0.1,c:[240,238,228]},{p:0.25,c:[248,244,234]},
  {p:0.4,c:[255,200,140]},{p:0.52,c:[80,65,100]},{p:0.7,c:[45,48,75]},
  {p:0.88,c:[150,155,175]},{p:1,c:[180,185,195]},
];
const CLOUD_SHADOW = [
  {p:0,c:[100,110,135]},{p:0.1,c:[140,155,180]},{p:0.25,c:[130,145,175]},
  {p:0.4,c:[195,125,80]},{p:0.52,c:[45,38,70]},{p:0.7,c:[22,25,50]},
  {p:0.88,c:[80,90,120]},{p:1,c:[100,110,135]},
];

const GREENS = [
  [110,150,65],
  [85,130,55],
  [65,110,45],
  [50,90,35],
];

function drawSky() {
  const top = sampleColorStops(SKY_TOP, dayTime);
  const bot = sampleColorStops(SKY_BOT, dayTime);
  const mid = lerpColor(top, bot, 0.5);
  const grad = ctx.createLinearGradient(0, 0, 0, horizonY);
  grad.addColorStop(0, rgb(top));
  grad.addColorStop(0.6, rgb(mid));
  grad.addColorStop(1, rgb(bot));
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, horizonY + 1);
}

function screenX(wx) {
  const ww = W * WORLD_WIDTH_MULT;
  return ((wx - worldOffset) % ww + ww * 1.5) % ww - ww * 0.25;
}

function drawCloud(cloud, isFar) {
  const sx = screenX(cloud.wx);
  if (sx < -200 || sx > W + 200) return;

  const hlRaw = sampleColorStops(CLOUD_HIGHLIGHT, dayTime);
  const shRaw = sampleColorStops(CLOUD_SHADOW, dayTime);
  const darkMul = isFar ? 0.82 : 1.0;
  const distFade = isFar ? (0.7 + cloud.opacity * 0.3) : 1.0;

  const warm = cloud.warmth || 0;
  const hl = [hlRaw[0]+warm*12, hlRaw[1]+warm*6, hlRaw[2]-warm*4];
  const sh = [shRaw[0]+warm*8, shRaw[1]+warm*4, shRaw[2]-warm*3];

  const tmpl = cloudTemplates[cloud.template];
  ctx.save();
  ctx.globalAlpha = cloud.opacity * distFade;

  const bx = sx, by = cloud.y, sc = cloud.scale;

  ctx.fillStyle = rgb(sh, darkMul * 0.7);
  ctx.beginPath();
  ctx.ellipse(bx, by + 16 * sc, 62 * sc, 18 * sc, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = rgb(sh, darkMul * 0.85);
  for (const c of tmpl) {
    if (c.y > -2) {
      ctx.beginPath();
      ctx.arc(bx + c.x * sc, by + (c.y + 4) * sc, c.r * sc * 1.05, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  ctx.fillStyle = rgb(hl, darkMul);
  for (const c of tmpl) {
    ctx.beginPath();
    ctx.arc(bx + c.x * sc, by + c.y * sc, c.r * sc, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.fillStyle = rgba([255,255,250], 0.18 * cloud.opacity);
  for (const c of tmpl) {
    if (c.y < -8) {
      ctx.beginPath();
      ctx.arc(bx + c.x * sc, by + (c.y - 2) * sc, c.r * sc * 0.55, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  ctx.restore();
}

function drawHaze() {
  const dayBrightness = Math.sin(dayTime * Math.PI);
  const hazeAlpha = 0.08 + dayBrightness * 0.12;
  const hazeColor = sampleColorStops(SKY_BOT, dayTime);
  const grad = ctx.createLinearGradient(0, horizonY - H * 0.06, 0, horizonY + H * 0.04);
  grad.addColorStop(0, rgba(hazeColor, 0));
  grad.addColorStop(0.4, rgba(hazeColor, hazeAlpha));
  grad.addColorStop(0.6, rgba(hazeColor, hazeAlpha));
  grad.addColorStop(1, rgba(hazeColor, 0));
  ctx.fillStyle = grad;
  ctx.fillRect(0, horizonY - H * 0.06, W, H * 0.1);
}

function drawSea() {
  const top = sampleColorStops(SEA_TOP, dayTime);
  const bot = sampleColorStops(SEA_BOT, dayTime);
  const grad = ctx.createLinearGradient(0, horizonY, 0, H);
  grad.addColorStop(0, rgb(top));
  grad.addColorStop(1, rgb(bot));
  ctx.fillStyle = grad;
  ctx.fillRect(0, horizonY, W, H - horizonY);

  const hlColor = sampleColorStops(CLOUD_HIGHLIGHT, dayTime);
  const dayBright = Math.sin(dayTime * Math.PI);
  const seaH = H - horizonY;

  const bandAlpha = 0.04 + dayBright * 0.04;
  for (let i = 0; i < 4; i++) {
    const by = horizonY + seaH * (0.1 + i * 0.25);
    const bx = ((i * W * 0.7 - worldOffset * (0.3 + i * 0.05)) % W + W * 2) % W - W * 0.3;
    const bw = W * (0.25 + i * 0.05);
    const bGrad = ctx.createLinearGradient(bx - bw, 0, bx + bw, 0);
    bGrad.addColorStop(0, `rgba(255,255,240,0)`);
    bGrad.addColorStop(0.5, `rgba(255,255,240,${bandAlpha * (1 - i * 0.15)})`);
    bGrad.addColorStop(1, `rgba(255,255,240,0)`);
    ctx.fillStyle = bGrad;
    ctx.fillRect(bx - bw, by, bw * 2, seaH * 0.08);
  }

  const waveAlpha1 = Math.min(0.22, (hlColor[0]+hlColor[1]+hlColor[2])/1500) * (0.5 + dayBright * 0.5);
  ctx.strokeStyle = rgba(hlColor, waveAlpha1);
  ctx.lineWidth = 0.9;
  for (let y = horizonY + 4; y < H; y += 6 + (y - horizonY) * 0.04) {
    ctx.beginPath();
    const depth = (y - horizonY) / seaH;
    for (let x = 0; x < W; x += 5) {
      const wx2 = x + worldOffset * (0.5 + depth * 0.5);
      const wy = y + Math.sin(wx2 * 0.015 + y * 0.07 + wavePhase) * (1.2 + depth * 2.5);
      if (x === 0) ctx.moveTo(x, wy); else ctx.lineTo(x, wy);
    }
    ctx.stroke();
  }

  const waveAlpha2 = waveAlpha1 * 0.45;
  ctx.strokeStyle = rgba(hlColor, waveAlpha2);
  ctx.lineWidth = 0.5;
  for (let y = horizonY + 8; y < H; y += 10 + (y - horizonY) * 0.06) {
    ctx.beginPath();
    const depth = (y - horizonY) / seaH;
    for (let x = 0; x < W; x += 7) {
      const wx2 = x + worldOffset * (0.7 + depth * 0.3);
      const wy = y + Math.sin(wx2 * 0.025 + y * 0.12 + wavePhase * 1.6 + 1.5) * (0.6 + depth * 1.2);
      if (x === 0) ctx.moveTo(x, wy); else ctx.lineTo(x, wy);
    }
    ctx.stroke();
  }

  ctx.strokeStyle = `rgba(255,255,255,${0.08 + dayBright * 0.1})`;
  ctx.lineWidth = 1.2;
  for (let y = horizonY + 6; y < H; y += 9 + (y - horizonY) * 0.07) {
    const depth = (y - horizonY) / seaH;
    const foamChance = 0.03 + depth * 0.02;
    for (let x = 0; x < W; x += 12) {
      const wx2 = x + worldOffset * (0.55 + depth * 0.45);
      const waveVal = Math.sin(wx2 * 0.015 + y * 0.07 + wavePhase);
      if (waveVal > 0.7 && Math.random() < foamChance) {
        const fy = y + waveVal * (1.2 + depth * 2.5);
        const fw = 3 + Math.random() * 6;
        ctx.beginPath();
        ctx.moveTo(x - fw, fy);
        ctx.quadraticCurveTo(x, fy - 1.5, x + fw, fy);
        ctx.stroke();
      }
    }
  }

  if (dayBright > 0.1) {
    const reflX = ((W * 0.5 - worldOffset) % W + W * 2) % W - W * 0.5;
    const reflW = W * 0.12;
    const rGrad = ctx.createLinearGradient(reflX - reflW, 0, reflX + reflW, 0);
    rGrad.addColorStop(0, `rgba(255,255,220,0)`);
    rGrad.addColorStop(0.5, `rgba(255,255,220,${0.07 * dayBright})`);
    rGrad.addColorStop(1, `rgba(255,255,220,0)`);
    ctx.fillStyle = rGrad;
    ctx.fillRect(reflX - reflW, horizonY, reflW * 2, seaH);
  }

  for (const sp of sparkles) {
    const sx = ((sp.x * W * 3 - worldOffset) % (W * 2) + W * 2) % (W * 1.5) - W * 0.25;
    const sy = horizonY + 8 + sp.y * (seaH - 16);
    const alpha = (0.25 + 0.7 * Math.abs(Math.sin(wavePhase * sp.speed + sp.phase))) * dayBright;
    if (alpha > 0.03) {
      ctx.fillStyle = `rgba(255,255,230,${alpha})`;
      ctx.beginPath();
      ctx.arc(sx, sy, sp.size, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

function islandColor(island, shade) {
  const distFade = 1 - island.dist * 0.35;
  const base = GREENS[shade % GREENS.length];
  const blueShift = island.dist * 30;
  return `rgb(${base[0]*distFade+blueShift|0},${base[1]*distFade+blueShift*0.5|0},${base[2]*distFade+blueShift|0})`;
}

function drawIsland(island) {
  const sx = screenX(island.wx);
  if (sx < -island.w * 0.7 || sx > W + island.w * 0.7) return;
  const baseY = horizonY + 1;
  const distFade = 1 - island.dist * 0.3;
  const alpha = 0.7 + distFade * 0.3;

  ctx.save();
  ctx.globalAlpha = alpha;

  const gDark = islandColor(island, 3);
  const gMid = islandColor(island, 1);
  const gLight = islandColor(island, 0);
  const rockColor = `rgb(${140-island.dist*40|0},${110-island.dist*30|0},${70-island.dist*20|0})`;
  const shoreColor = `rgb(${100-island.dist*30|0},${85-island.dist*25|0},${60-island.dist*15|0})`;

  const shoreGrad = ctx.createLinearGradient(sx, baseY - island.h * 0.3, sx, baseY + 6);
  shoreGrad.addColorStop(0, gMid);
  shoreGrad.addColorStop(0.7, shoreColor);
  shoreGrad.addColorStop(1, rockColor);
  ctx.fillStyle = shoreGrad;

  ctx.beginPath();
  ctx.moveTo(sx - island.w * 0.48, baseY);
  ctx.bezierCurveTo(
    sx - island.w * 0.42, baseY - island.h * 0.5,
    sx - island.w * 0.25, baseY - island.h * 0.85,
    sx - island.w * 0.08, baseY - island.h * 0.95
  );
  ctx.bezierCurveTo(
    sx + island.w * 0.02, baseY - island.h * 1.02,
    sx + island.w * 0.15, baseY - island.h * 0.92,
    sx + island.w * 0.28, baseY - island.h * 0.7
  );
  ctx.bezierCurveTo(
    sx + island.w * 0.38, baseY - island.h * 0.45,
    sx + island.w * 0.45, baseY - island.h * 0.15,
    sx + island.w * 0.48, baseY
  );
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = `rgba(80,70,50,0.3)`;
  ctx.beginPath();
  ctx.ellipse(sx, baseY + 3, island.w * 0.5, 5, 0, 0, Math.PI);
  ctx.fill();

  for (const rock of island.rocks) {
    ctx.fillStyle = shoreColor;
    ctx.beginPath();
    ctx.ellipse(sx + rock.x, baseY + rock.y, rock.r * 1.3, rock.r * 0.8, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  for (const tree of island.trees) {
    const tx = sx + tree.x;
    const ty = baseY + tree.y;
    const litSide = tree.x > 0;
    ctx.fillStyle = litSide ? gLight : gDark;
    ctx.beginPath();
    ctx.arc(tx, ty, tree.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = litSide ? gMid : `rgba(30,50,25,0.4)`;
    ctx.beginPath();
    ctx.arc(tx + tree.r * 0.3, ty + tree.r * 0.3, tree.r * 0.6, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.restore();
}

function drawPlane() {
  ctx.save();
  ctx.translate(planeX, planeY);
  ctx.rotate(planeAngle);
  const s = planeScale;
  // Floor for tiny details so nothing renders sub-pixel (mobile shimmer);
  // sizes only — positions stay proportional, desktop look unchanged
  const fz = (v, m) => Math.max(v * s, m === undefined ? 0.65 : m);

  ctx.fillStyle = '#c81020';
  ctx.beginPath();
  ctx.moveTo(-28 * s, 0);
  ctx.bezierCurveTo(-30 * s, -6 * s, -24 * s, -9 * s, -12 * s, -9 * s);
  ctx.lineTo(22 * s, -7 * s);
  ctx.bezierCurveTo(28 * s, -5 * s, 32 * s, -2 * s, 33 * s, 1 * s);
  ctx.bezierCurveTo(31 * s, 5 * s, 24 * s, 7 * s, 12 * s, 7 * s);
  ctx.lineTo(-16 * s, 7 * s);
  ctx.bezierCurveTo(-25 * s, 5 * s, -28 * s, 3 * s, -28 * s, 0);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = '#e02035';
  ctx.beginPath();
  ctx.moveTo(-22 * s, -5.5 * s);
  ctx.lineTo(20 * s, -5.5 * s);
  ctx.lineTo(20 * s, -3 * s);
  ctx.lineTo(-22 * s, -3 * s);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = '#a00e18';
  ctx.beginPath();
  ctx.moveTo(-22 * s, 4 * s);
  ctx.lineTo(18 * s, 4 * s);
  ctx.lineTo(18 * s, 6 * s);
  ctx.lineTo(-22 * s, 6 * s);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = '#1a1a2a';
  ctx.beginPath();
  ctx.ellipse(6 * s, -10 * s, 5 * s, 3 * s, 0, Math.PI, 0);
  ctx.fill();
  ctx.fillStyle = 'rgba(100,140,180,0.3)';
  ctx.beginPath();
  ctx.ellipse(5 * s, -10 * s, 3.5 * s, 1.8 * s, -0.2, Math.PI, 0);
  ctx.fill();

  // Porco the pig pilot in the cockpit (side view, facing +x)
  ctx.save();
  ctx.translate(4 * s, -11 * s);
  // Flowing scarf streaming back in the wind, with a gentle flutter
  const flutter = Math.sin(wavePhase * 3) * 1 * s;
  ctx.fillStyle = '#f2ede0';
  ctx.beginPath();
  ctx.moveTo(-1.5 * s, -2 * s);
  ctx.quadraticCurveTo(-6 * s, -4.5 * s + flutter, -11 * s, -3 * s + flutter);
  ctx.quadraticCurveTo(-6.5 * s, -2 * s, -5 * s, -0.5 * s);
  ctx.quadraticCurveTo(-3 * s, -1 * s, -1.5 * s, -2 * s);
  ctx.closePath();
  ctx.fill();
  // Cockpit coaming rim
  ctx.fillStyle = '#4a2c14';
  ctx.beginPath();
  ctx.ellipse(0, 1 * s, 4 * s, 2 * s, 0, 0, Math.PI * 2);
  ctx.fill();
  // Flight-jacket shoulders
  ctx.fillStyle = '#8a6a3a';
  ctx.beginPath();
  ctx.ellipse(0.3 * s, 0.5 * s, 3.2 * s, 2.2 * s, 0, 0, Math.PI * 2);
  ctx.fill();
  // Pig head
  ctx.fillStyle = '#e8b48c';
  ctx.beginPath();
  ctx.arc(0.5 * s, -3.5 * s, 2.6 * s, 0, Math.PI * 2);
  ctx.fill();
  // Round ear
  ctx.fillStyle = '#e8b48c';
  ctx.beginPath();
  ctx.moveTo(-1.5 * s, -5 * s);
  ctx.quadraticCurveTo(-2.8 * s, -7 * s, -0.8 * s, -6.8 * s);
  ctx.quadraticCurveTo(-0.5 * s, -5.8 * s, -1.5 * s, -5 * s);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = '#c98a64';
  ctx.beginPath();
  ctx.arc(-1.4 * s, -6 * s, fz(0.7), 0, Math.PI * 2);
  ctx.fill();
  // Khaki flight cap over the back/top of the head
  ctx.fillStyle = '#7a7040';
  ctx.beginPath();
  ctx.moveTo(-2.2 * s, -3.5 * s);
  ctx.quadraticCurveTo(-2.5 * s, -6.5 * s, 0 * s, -6.8 * s);
  ctx.quadraticCurveTo(1.8 * s, -7 * s, 2.2 * s, -5 * s);
  ctx.quadraticCurveTo(0.5 * s, -5.8 * s, -1 * s, -4.5 * s);
  ctx.quadraticCurveTo(-1.8 * s, -3.8 * s, -2.2 * s, -3.5 * s);
  ctx.closePath();
  ctx.fill();
  // Goggle strap and lens on the cap
  ctx.strokeStyle = '#3a2c1a';
  ctx.lineWidth = fz(0.7, 0.8);
  ctx.beginPath();
  ctx.moveTo(-2.2 * s, -5.2 * s);
  ctx.quadraticCurveTo(0 * s, -6 * s, 2.2 * s, -5.4 * s);
  ctx.stroke();
  ctx.fillStyle = '#2e2e34';
  ctx.beginPath();
  ctx.arc(1.1 * s, -5.6 * s, fz(1), 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = 'rgba(160,200,230,0.7)';
  ctx.beginPath();
  ctx.arc(0.8 * s, -5.9 * s, fz(0.35), 0, Math.PI * 2);
  ctx.fill();
  // Snout with nostrils
  ctx.fillStyle = '#f2c9a4';
  ctx.beginPath();
  ctx.ellipse(2.4 * s, -2.8 * s, 1.3 * s, 1.1 * s, 0.15, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#5a3222';
  ctx.beginPath();
  ctx.arc(2.5 * s, -2.9 * s, fz(0.28), 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(3.2 * s, -2.7 * s, fz(0.28), 0, Math.PI * 2);
  ctx.fill();
  // Eye and mustache flick
  ctx.fillStyle = '#2a1c12';
  ctx.beginPath();
  ctx.arc(1.3 * s, -4.3 * s, fz(0.32), 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#3a2418';
  ctx.lineWidth = fz(0.5, 0.8);
  ctx.beginPath();
  ctx.moveTo(2.9 * s, -1.9 * s);
  ctx.quadraticCurveTo(3.6 * s, -1.7 * s, 3.9 * s, -1.2 * s);
  ctx.stroke();
  ctx.restore();

  ctx.fillStyle = '#c81020';
  ctx.beginPath();
  ctx.moveTo(-12 * s, -21 * s);
  ctx.bezierCurveTo(-8 * s, -23 * s, 20 * s, -23 * s, 30 * s, -21 * s);
  ctx.lineTo(30 * s, -17 * s);
  ctx.bezierCurveTo(20 * s, -18.5 * s, -8 * s, -18.5 * s, -12 * s, -17 * s);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = '#e02035';
  ctx.fillRect(-10 * s, -21 * s, 38 * s, 2 * s);

  ctx.fillStyle = '#c81020';
  ctx.fillRect(-4 * s, -4 * s, 20 * s, 3 * s);

  // Vertical tail fin with Italian tricolor (Porco's Savoia S.21 rudder).
  // Side view, nose +x: bands run front -> back (right -> left):
  // green (leading), white (center, R + shield), red rudder (trailing).
  // Short round fin: parallel blade with a semicircular crown.
  const finPath = new Path2D();
  finPath.moveTo(-25.5 * s, -3.5 * s);
  finPath.quadraticCurveTo(-26 * s, -7 * s, -26.2 * s, -9 * s);
  finPath.quadraticCurveTo(-26.2 * s, -13.7 * s, -30.85 * s, -13.7 * s);
  finPath.quadraticCurveTo(-35.5 * s, -13.7 * s, -35.5 * s, -9 * s);
  finPath.lineTo(-35.5 * s, -2 * s);
  finPath.quadraticCurveTo(-30 * s, -3 * s, -25.5 * s, -3.5 * s);
  finPath.closePath();
  ctx.fillStyle = '#f6f6f0';
  ctx.fill(finPath);
  // Tricolor bands clipped to the fin: green leading band, red rudder;
  // the white base shows through as the center band
  ctx.save();
  ctx.clip(finPath);
  ctx.fillStyle = '#c81020';
  ctx.fillRect(-35.6 * s, -15 * s, 3.4 * s, 23 * s);
  ctx.fillStyle = '#35a047';
  ctx.fillRect(-29.6 * s, -15 * s, 4.5 * s, 23 * s);
  // Light rim highlight inside the green leading edge, up into the crown
  ctx.strokeStyle = '#7ec87e';
  ctx.lineWidth = 2 * s;
  ctx.beginPath();
  ctx.moveTo(-25.5 * s, -3.5 * s);
  ctx.quadraticCurveTo(-26 * s, -7 * s, -26.2 * s, -9 * s);
  ctx.quadraticCurveTo(-26.2 * s, -13.7 * s, -30.85 * s, -13.7 * s);
  ctx.stroke();
  ctx.restore();
  // Dark red outline around the fin
  ctx.strokeStyle = '#7a1010';
  ctx.lineWidth = fz(1, 0.8);
  ctx.stroke(finPath);
  // Small red fillet where the leading edge meets the fuselage
  ctx.fillStyle = '#c81020';
  ctx.beginPath();
  ctx.moveTo(-25.5 * s, -3 * s);
  ctx.lineTo(-28.5 * s, -3.5 * s);
  ctx.lineTo(-26 * s, -6.5 * s);
  ctx.closePath();
  ctx.fill();
  // Rudder rib lines and hinge post on the red rudder section
  ctx.strokeStyle = '#7a1010';
  ctx.lineWidth = fz(0.6, 0.8);
  ctx.beginPath();
  ctx.moveTo(-35.3 * s, -5.5 * s); ctx.lineTo(-32.4 * s, -5.5 * s);
  ctx.moveTo(-35.3 * s, -8 * s); ctx.lineTo(-32.4 * s, -8 * s);
  ctx.stroke();
  ctx.lineWidth = fz(0.8, 0.8);
  ctx.beginPath();
  ctx.moveTo(-32.2 * s, -3.5 * s); ctx.lineTo(-32.2 * s, -8.5 * s);
  ctx.stroke();
  // Red "R" over a yellow/blue shield on the white band
  ctx.fillStyle = '#ce2b37';
  ctx.fillRect(-31.5 * s, -8.6 * s, fz(1.2), fz(0.5));
  ctx.fillRect(-31.5 * s, -8.6 * s, fz(0.5), fz(1.8));
  ctx.fillRect(-31 * s, -7.9 * s, fz(1), fz(0.45));
  ctx.beginPath();
  ctx.moveTo(-31.6 * s, -6.6 * s);
  ctx.lineTo(-30.2 * s, -6.6 * s);
  ctx.lineTo(-30.2 * s, -5 * s);
  ctx.lineTo(-30.9 * s, -4.4 * s);
  ctx.lineTo(-31.6 * s, -5 * s);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = '#e8c33a';
  ctx.fillRect(-31.4 * s, -6.4 * s, fz(0.9), fz(0.7));
  ctx.fillStyle = '#2a4a9a';
  ctx.fillRect(-31.4 * s, -5.7 * s, fz(0.9), fz(0.7));

  ctx.fillStyle = '#c81020';
  ctx.beginPath();
  ctx.moveTo(-24 * s, 0);
  ctx.lineTo(-35 * s, -3 * s);
  ctx.lineTo(-35 * s, 0);
  ctx.lineTo(-24 * s, 2 * s);
  ctx.closePath();
  ctx.fill();

  ctx.strokeStyle = '#8B5E3C';
  ctx.lineWidth = fz(1.2, 0.8);
  ctx.beginPath();
  ctx.moveTo(-2 * s, -17 * s); ctx.lineTo(-2 * s, -9 * s);
  ctx.moveTo(10 * s, -17 * s); ctx.lineTo(10 * s, -4 * s);
  ctx.moveTo(20 * s, -17 * s); ctx.lineTo(20 * s, -7 * s);
  ctx.stroke();

  ctx.fillStyle = '#5a3a1a';
  ctx.beginPath();
  ctx.ellipse(6 * s, -25 * s, 9 * s, 3.5 * s, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#4a2a10';
  ctx.beginPath();
  ctx.ellipse(4 * s, -25 * s, 6 * s, 2.5 * s, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.save();
  ctx.translate(14 * s, -25 * s);
  ctx.rotate(propAngle);
  ctx.fillStyle = 'rgba(40,40,40,0.1)';
  ctx.beginPath();
  ctx.arc(0, 0, 14 * s, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#2a2a2a';
  ctx.fillRect(-0.6 * s, -12 * s, 1.2 * s, 24 * s);
  ctx.fillRect(-12 * s, -0.6 * s, 24 * s, 1.2 * s);
  ctx.fillStyle = '#555';
  ctx.beginPath();
  ctx.arc(0, 0, 2 * s, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  ctx.fillStyle = '#c81020';
  ctx.beginPath();
  ctx.moveTo(-16 * s, 11 * s);
  ctx.lineTo(12 * s, 11 * s);
  ctx.lineTo(15 * s, 13 * s);
  ctx.lineTo(12 * s, 15 * s);
  ctx.lineTo(-14 * s, 15 * s);
  ctx.lineTo(-18 * s, 13 * s);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = '#e02035';
  ctx.fillRect(-14 * s, 11 * s, 26 * s, 1.5 * s);

  ctx.strokeStyle = '#8B5E3C';
  ctx.lineWidth = fz(1, 0.8);
  ctx.beginPath();
  ctx.moveTo(-6 * s, 7 * s); ctx.lineTo(-6 * s, 11 * s);
  ctx.moveTo(6 * s, 5 * s); ctx.lineTo(6 * s, 11 * s);
  ctx.moveTo(14 * s, 5 * s); ctx.lineTo(14 * s, 11 * s);
  ctx.stroke();

  ctx.restore();
}

function drawBoat(boat) {
  const sx = screenX(boat.wx);
  if (sx < -40 || sx > W + 40) return;
  const seaDepth = boat.seaY;
  const sy = horizonY + 8 + boat.seaY * (H - horizonY - 16);
  const bob = Math.sin(wavePhase * 1.2 + boat.wx * 0.003) * (1 + seaDepth);
  const tilt = Math.sin(wavePhase * 0.8 + boat.wx * 0.005) * 0.06;
  const sc = 0.6 + seaDepth * 0.6;

  ctx.save();
  ctx.translate(sx, sy + bob);
  ctx.rotate(tilt);
  ctx.scale(sc, sc);

  ctx.fillStyle = '#5a3a20';
  ctx.beginPath();
  ctx.moveTo(-14, 0);
  ctx.quadraticCurveTo(-16, 4, -10, 5);
  ctx.lineTo(10, 5);
  ctx.quadraticCurveTo(16, 4, 14, 0);
  ctx.quadraticCurveTo(10, -2, -10, -2);
  ctx.quadraticCurveTo(-14, -2, -14, 0);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = '#8a6a40';
  ctx.fillRect(-8, -3, 16, 2);

  ctx.strokeStyle = '#4a3018';
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.moveTo(0, -3);
  ctx.lineTo(0, -16);
  ctx.stroke();

  if (boat.hasSail) {
    ctx.fillStyle = 'rgba(240,235,225,0.85)';
    ctx.beginPath();
    ctx.moveTo(1, -15);
    ctx.quadraticCurveTo(9, -10, 1, -4);
    ctx.closePath();
    ctx.fill();
  }

  ctx.restore();
}

function drawHotelAdriano(island) {
  const sx = screenX(island.wx);
  if (sx < -island.w || sx > W + island.w) return;
  const baseY = horizonY + 1;
  const sc = 0.7 + (1 - island.dist) * 0.5;
  const alpha = 0.6 + (1 - island.dist) * 0.4;

  ctx.save();
  ctx.globalAlpha = alpha;

  const bw = island.w * 0.4;
  const bh = island.h * 1.1;
  const baseTop = baseY - bh * 0.3;

  // --- Stone base wall ---
  const wallW = bw * 0.95;
  const wallH = bh * 0.35;
  const wallX = sx - wallW * 0.5;
  const wallY = baseTop;

  const wallGrad = ctx.createLinearGradient(wallX, wallY, wallX, wallY + wallH);
  wallGrad.addColorStop(0, '#c4a06a');
  wallGrad.addColorStop(1, '#a88850');
  ctx.fillStyle = wallGrad;
  ctx.fillRect(wallX, wallY, wallW, wallH);

  ctx.fillStyle = '#b89858';
  ctx.fillRect(wallX, wallY, wallW, 2 * sc);

  // Water gate arch (small, right-of-center like the reference)
  const gateX = sx + bw * 0.22;
  const gateW = 6 * sc;
  const gateH = 7 * sc;
  ctx.fillStyle = '#3a2a1a';
  ctx.beginPath();
  ctx.ellipse(gateX, wallY + wallH, gateW * 0.5, gateH, 0, Math.PI, 0);
  ctx.fill();

  // Faint plaster block lines and weathering on the open wall
  ctx.strokeStyle = 'rgba(90,60,30,0.1)';
  ctx.lineWidth = Math.max(0.6, 0.7 * sc);
  for (let li = 1; li <= 2; li++) {
    const ly = wallY + wallH * (0.3 + li * 0.2);
    ctx.beginPath();
    ctx.moveTo(wallX + 4 * sc, ly);
    ctx.lineTo(wallX + wallW - 4 * sc, ly);
    ctx.stroke();
  }

  // Small slit windows tucked under the ivy line, clear of the logo
  ctx.fillStyle = '#3a2a1a';
  const slitX = [0.08, 0.66, 0.88];
  for (let wi = 0; wi < 3; wi++) {
    const wx = wallX + wallW * slitX[wi];
    ctx.fillRect(wx, wallY + wallH * 0.04, 4 * sc, 4 * sc);
  }

  // --- Main hotel building ---
  const bldgW = bw * 0.6;
  const bldgH = bh * 0.55;
  const bldgX = sx - bldgW * 0.5;
  const bldgY = wallY - bldgH;

  const bldgGrad = ctx.createLinearGradient(bldgX, bldgY, bldgX + bldgW, bldgY);
  bldgGrad.addColorStop(0, '#d4a854');
  bldgGrad.addColorStop(0.5, '#deb864');
  bldgGrad.addColorStop(1, '#c89840');
  ctx.fillStyle = bldgGrad;
  ctx.fillRect(bldgX, bldgY, bldgW, bldgH);

  // Windows - arched, 3 rows
  ctx.fillStyle = '#5a4030';
  for (let row = 0; row < 3; row++) {
    const cols = row === 0 ? 3 : 4;
    for (let c = 0; c < cols; c++) {
      const wx = bldgX + bldgW * (0.1 + (c + 0.5) / cols * 0.8);
      const wy = bldgY + bldgH * (0.15 + row * 0.28);
      const ww = 5 * sc;
      const wh = 7 * sc;
      ctx.fillRect(wx - ww * 0.5, wy, ww, wh);
      ctx.beginPath();
      ctx.ellipse(wx, wy, ww * 0.5, ww * 0.5, 0, Math.PI, 0);
      ctx.fill();
      // Blue shutters
      ctx.fillStyle = '#5080a0';
      ctx.fillRect(wx - ww * 0.5 - 2 * sc, wy, 2 * sc, wh);
      ctx.fillRect(wx + ww * 0.5, wy, 2 * sc, wh);
      ctx.fillStyle = '#5a4030';
    }
  }

  // Balcony railing (2nd floor)
  const balconyY = bldgY + bldgH * 0.42;
  ctx.strokeStyle = '#8a7050';
  ctx.lineWidth = 1.5 * sc;
  ctx.beginPath();
  ctx.moveTo(bldgX + bldgW * 0.15, balconyY);
  ctx.lineTo(bldgX + bldgW * 0.85, balconyY);
  ctx.stroke();
  for (let bi = 0; bi < 8; bi++) {
    const bx = bldgX + bldgW * (0.17 + bi * 0.09);
    ctx.beginPath();
    ctx.moveTo(bx, balconyY);
    ctx.lineTo(bx, balconyY - 4 * sc);
    ctx.stroke();
  }

  // Central arched entrance on ground floor
  const doorX = sx;
  const doorW = 8 * sc;
  const doorH = 12 * sc;
  const doorY = wallY - doorH;
  ctx.fillStyle = '#4a3020';
  ctx.fillRect(doorX - doorW * 0.5, doorY, doorW, doorH);
  ctx.beginPath();
  ctx.ellipse(doorX, doorY, doorW * 0.5, doorW * 0.5, 0, Math.PI, 0);
  ctx.fill();

  // --- Red terracotta roof ---
  const roofH = bh * 0.18;
  ctx.fillStyle = '#b83c20';
  ctx.beginPath();
  ctx.moveTo(bldgX - 3 * sc, bldgY);
  ctx.lineTo(sx, bldgY - roofH);
  ctx.lineTo(bldgX + bldgW + 3 * sc, bldgY);
  ctx.closePath();
  ctx.fill();

  // Roof highlight
  ctx.fillStyle = '#d04828';
  ctx.beginPath();
  ctx.moveTo(bldgX, bldgY);
  ctx.lineTo(sx, bldgY - roofH + 2 * sc);
  ctx.lineTo(bldgX + bldgW * 0.5, bldgY);
  ctx.closePath();
  ctx.fill();

  // Central tower/dome
  const towerW = 10 * sc;
  const towerH = bh * 0.2;
  const towerX = sx;
  const towerY = bldgY - roofH;
  ctx.fillStyle = '#d4a854';
  ctx.fillRect(towerX - towerW * 0.5, towerY - towerH, towerW, towerH);
  ctx.fillStyle = '#b83c20';
  ctx.beginPath();
  ctx.moveTo(towerX - towerW * 0.6, towerY - towerH);
  ctx.lineTo(towerX, towerY - towerH - 6 * sc);
  ctx.lineTo(towerX + towerW * 0.6, towerY - towerH);
  ctx.closePath();
  ctx.fill();
  // Dome tip
  ctx.fillStyle = '#c89840';
  ctx.beginPath();
  ctx.arc(towerX, towerY - towerH - 6 * sc, 2 * sc, 0, Math.PI * 2);
  ctx.fill();

  // --- Ivy hanging from the wall top (rooted strands, never floating) ---
  // Strands start tucked under the top trim and hang downward, constrained
  // to the wall span at the top corners and flanks, clear of the logo
  if (island.vines) {
    const strandX = [0.07, 0.25, 0.75, 0.93];
    island.vines.forEach((vine, i) => {
      const fx = strandX[i % strandX.length] + (vine.x / island.w) * 0.1;
      const vx = wallX + wallW * fx;
      const len = (6 + (vine.h % 8)) * sc;
      const sway = ((i % 2) ? 1 : -1) * 2 * sc;
      // Root cluster tucked under the trim
      ctx.fillStyle = '#3a6a2a';
      ctx.beginPath();
      ctx.ellipse(vx, wallY + 1.5 * sc, 2.6 * sc, 2 * sc, 0, 0, Math.PI * 2);
      ctx.fill();
      // Tapering strand hanging from the root
      ctx.strokeStyle = '#3a6a2a';
      ctx.lineCap = 'round';
      ctx.lineWidth = 2.2 * sc;
      ctx.beginPath();
      ctx.moveTo(vx, wallY + 1 * sc);
      ctx.quadraticCurveTo(vx + sway, wallY + len * 0.5, vx - sway * 0.5, wallY + len);
      ctx.stroke();
      ctx.strokeStyle = '#4a7a32';
      ctx.lineWidth = 1.2 * sc;
      ctx.beginPath();
      ctx.moveTo(vx, wallY + 1 * sc);
      ctx.quadraticCurveTo(vx + sway, wallY + len * 0.5, vx - sway * 0.5, wallY + len);
      ctx.stroke();
      // Leaf dots along the strand
      ctx.fillStyle = '#4a7a32';
      for (let l = 1; l <= 4; l++) {
        const ly = wallY + 1 * sc + (len * l) / 5;
        const lx = vx + ((l % 2) ? 1 : -1) * 1.6 * sc;
        ctx.beginPath();
        ctx.arc(lx, ly, (1.1 + (l % 2) * 0.5) * sc, 0, Math.PI * 2);
        ctx.fill();
      }
    });
    ctx.lineCap = 'butt';
  }

  // --- Terrace with umbrellas (right side) ---
  const terrX = sx + bw * 0.32;
  const terrY = wallY - 2 * sc;

  // Terrace floor
  ctx.fillStyle = '#d4b878';
  ctx.fillRect(terrX - 15 * sc, terrY, 30 * sc, 3 * sc);

  // Umbrellas
  const umbrellaColors = ['#e86080', '#50a0d0', '#e8d040'];
  for (let u = 0; u < 3; u++) {
    const ux = terrX + (u - 1) * 9 * sc;
    const uy = terrY - 2 * sc;
    ctx.fillStyle = '#6a5040';
    ctx.fillRect(ux - 0.5 * sc, uy, 1 * sc, 8 * sc);
    ctx.fillStyle = umbrellaColors[u];
    ctx.beginPath();
    ctx.ellipse(ux, uy, 5 * sc, 3 * sc, 0, 0, Math.PI);
    ctx.fill();
  }

  // --- Stairs to water (right) ---
  const stairX = sx + bw * 0.45;
  const stairW = 8 * sc;
  const stairSteps = 5;
  ctx.fillStyle = '#b89858';
  for (let s = 0; s < stairSteps; s++) {
    const sy = wallY + s * (wallH * 0.15);
    ctx.fillRect(stairX, sy, stairW * (1 - s * 0.1), wallH * 0.13);
  }

  // Low bushes hugging the wall base (reference greenery, no tall trees)
  ctx.fillStyle = '#3a6a2a';
  const bushSpots = [[0.04, 3.2], [0.16, 4], [0.6, 3.4], [0.8, 3.8]];
  for (const [bf, br] of bushSpots) {
    ctx.beginPath();
    ctx.arc(wallX + wallW * bf, baseY - 1, br * sc, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.fillStyle = '#4a7a32';
  for (const [bf, br] of bushSpots) {
    ctx.beginPath();
    ctx.arc(wallX + wallW * bf - br * sc * 0.3, baseY - 1 - br * sc * 0.4, br * sc * 0.55, 0, Math.PI * 2);
    ctx.fill();
  }

  // --- Painted script logo on the open plaster (reference: red script
  // "Hotel" over "Adriano" with a flourish, clear of windows and gate) ---
  ctx.save();
  ctx.translate(sx - bw * 0.1, wallY + wallH * 0.54);
  ctx.rotate(-0.04);
  ctx.fillStyle = '#a03523';
  ctx.textAlign = 'center';
  ctx.font = `italic ${5.5 * sc}px ${FONT_STORY}`;
  ctx.fillText('Hotel', 0, -4.5 * sc);
  ctx.font = `italic bold ${7 * sc}px ${FONT_STORY}`;
  ctx.fillText('Adriano', 0, 3.5 * sc);
  ctx.strokeStyle = '#a03523';
  ctx.lineWidth = Math.max(0.8, 1 * sc);
  ctx.beginPath();
  ctx.moveTo(-13 * sc, 5.5 * sc);
  ctx.quadraticCurveTo(0, 8 * sc, 14 * sc, 5.5 * sc);
  ctx.stroke();
  ctx.lineWidth = Math.max(0.6, 0.7 * sc);
  ctx.beginPath();
  ctx.moveTo(-9 * sc, 7.2 * sc);
  ctx.quadraticCurveTo(2 * sc, 9 * sc, 11 * sc, 7 * sc);
  ctx.stroke();
  ctx.restore();

  // --- Dock extending left ---
  const dockStartX = sx - bw * 0.48;
  const dockEndX = dockStartX - bw * 0.7;
  const dockY = baseY - 1;
  const dockH = 3 * sc;

  // Dock posts
  ctx.fillStyle = '#6a5030';
  const postCount = 7;
  for (let p = 0; p < postCount; p++) {
    const px = dockEndX + (dockStartX - dockEndX) * (p / (postCount - 1));
    ctx.fillRect(px - 1.5 * sc, dockY - dockH * 3, 3 * sc, dockH * 4);
  }

  // Dock planks
  ctx.fillStyle = '#8a7050';
  ctx.fillRect(dockEndX, dockY - dockH * 1.5, dockStartX - dockEndX, dockH);

  // Seaplane silhouette at dock end
  const planeX = dockEndX + 15 * sc;
  const planeY = dockY - dockH * 2.5;
  ctx.fillStyle = '#c43030';
  ctx.fillRect(planeX - 12 * sc, planeY, 24 * sc, 3 * sc);
  ctx.fillRect(planeX - 2 * sc, planeY - 5 * sc, 4 * sc, 5 * sc);
  ctx.fillStyle = '#e8d8c8';
  ctx.beginPath();
  ctx.moveTo(planeX - 10 * sc, planeY + 3 * sc);
  ctx.lineTo(planeX + 10 * sc, planeY + 3 * sc);
  ctx.lineTo(planeX + 8 * sc, planeY + 5 * sc);
  ctx.lineTo(planeX - 8 * sc, planeY + 5 * sc);
  ctx.closePath();
  ctx.fill();

  ctx.restore();
}

function drawJoystick() {
  if (!touch.active) return;
  const scale = Math.max(1, W / 1200);
  const baseR = 45 * scale, knobR = 18 * scale;
  ctx.save();
  ctx.globalAlpha = 0.3;
  ctx.beginPath();
  ctx.arc(touch.startX, touch.startY, baseR, 0, Math.PI * 2);
  ctx.fillStyle = '#fff';
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.5)';
  ctx.lineWidth = 2;
  ctx.stroke();

  let dx = touch.x - touch.startX, dy = touch.y - touch.startY;
  const dist = Math.sqrt(dx*dx+dy*dy);
  const maxD = baseR - knobR;
  let kx = touch.x, ky = touch.y;
  if (dist > maxD) { kx = touch.startX+(dx/dist)*maxD; ky = touch.startY+(dy/dist)*maxD; }
  ctx.globalAlpha = 0.5;
  ctx.beginPath();
  ctx.arc(kx, ky, knobR, 0, Math.PI * 2);
  ctx.fillStyle = '#fff';
  ctx.fill();
  ctx.restore();
}

function drawCredits() {
  if (creditsT < 0) return;
  const total = CREDITS_IN + CREDITS_HOLD + CREDITS_OUT;
  if (creditsT > total) return;
  let a;
  if (creditsT < CREDITS_IN) a = creditsT / CREDITS_IN;
  else if (creditsT < CREDITS_IN + CREDITS_HOLD) a = 1;
  else a = 1 - (creditsT - CREDITS_IN - CREDITS_HOLD) / CREDITS_OUT;
  const unit = Math.min(W, H);
  ctx.save();
  ctx.globalAlpha = Math.max(0, Math.min(1, a));
  ctx.textAlign = 'center';
  const baseY = H - H * 0.06;
  ctx.font = `italic bold ${Math.max(18, unit * 0.055)}px ${FONT_STORY}`;
  ctx.lineWidth = Math.max(2, unit * 0.004);
  ctx.strokeStyle = 'rgba(10,15,30,0.7)';
  ctx.strokeText("A pig's gotta fly.", W / 2, baseY - unit * 0.045);
  ctx.fillStyle = '#f5f0e0';
  ctx.fillText("A pig's gotta fly.", W / 2, baseY - unit * 0.045);
  ctx.font = `${Math.max(11, unit * 0.022)}px sans-serif`;
  ctx.fillStyle = 'rgba(245,240,224,0.85)';
  ctx.fillText('made with ❤️ by varun', W / 2, baseY);
  ctx.restore();
}

function handleInput(dt) {
  let ix = 0, iy = 0;
  if (keys['ArrowLeft'] || keys['KeyA']) ix -= 1;
  if (keys['ArrowRight'] || keys['KeyD']) ix += 1;
  if (keys['ArrowUp'] || keys['KeyW']) iy -= 1;
  if (keys['ArrowDown'] || keys['KeyS']) iy += 1;

  // Match the drawn joystick size (see drawJoystick) so visual and response agree
  const joyScale = Math.max(1, W / 1200);
  if (touch.active) {
    const dx = touch.x - touch.startX, dy = touch.y - touch.startY;
    const dist = Math.sqrt(dx*dx+dy*dy);
    const maxD = 27 * joyScale;
    if (dist > 4 * joyScale) {
      ix += Math.max(-1, Math.min(1, dx / maxD));
      iy += Math.max(-1, Math.min(1, dy / maxD));
    }
  }

  const mag = Math.sqrt(ix*ix+iy*iy);
  if (mag > 0) {
    const nx = ix/Math.max(mag,1), ny = iy/Math.max(mag,1);
    const strength = Math.min(mag, 1);
    planeVX += nx * PLANE_SPEED * strength * dt;
    planeVY += ny * PLANE_SPEED * strength * dt;
  }

  // Frame-rate independent damping: PLANE_FRICTION is calibrated for 60fps
  const damp = Math.pow(PLANE_FRICTION, dt * 60);
  planeVX *= damp;
  planeVY *= damp;
  planeX += planeVX * dt;
  planeY += planeVY * dt;

  const scale = Math.max(1, W / 1200);
  const margin = 20 * scale;
  planeX = Math.max(margin, Math.min(W - margin, planeX));
  planeY = Math.max(margin, Math.min(H - margin, planeY));

  const hasInput = mag > 0 || touch.active;
  const targetAngle = hasInput ? (planeVY * 0.002 + planeVX * 0.0008) : 0;
  planeAngle += (targetAngle - planeAngle) * Math.min(1, dt * 5);
}

function updateWorld(dt) {
  const scrollSpeed = SCROLL_BASE * (W / 1200);
  const ww = W * WORLD_WIDTH_MULT;
  const prevRev = Math.floor(worldOffset / ww);
  worldOffset += scrollSpeed * dt;
  const curRev = Math.floor(worldOffset / ww);
  if (curRev > prevRev) {
    ginaIslandCounter += islands.filter(i => !i.isGinaBar).length;
  }
  propAngle += dt * 28;
  wavePhase += dt * 1.5;
  dayTime += dt / DAY_CYCLE;
  if (dayTime > 1) dayTime -= 1;

  boatSpawnTimer -= dt;
  if (boatSpawnTimer <= 0) {
    boatSpawnTimer = DAY_CYCLE * (0.6 + Math.random() * 0.8);
    const ww = W * WORLD_WIDTH_MULT;
    boats.push({
      wx: worldOffset + W + 50 + Math.random() * 200,
      seaY: 0.05 + Math.random() * 0.85,
      hasSail: Math.random() > 0.4,
    });
  }

  const buffer = 250;
  for (const c of farClouds) { const sx = screenX(c.wx); if (sx < -buffer) c.wx += ww; if (sx > W+buffer+ww*0.5) c.wx -= ww; }
  for (const c of nearClouds) { const sx = screenX(c.wx); if (sx < -buffer) c.wx += ww; if (sx > W+buffer+ww*0.5) c.wx -= ww; }
  for (let idx = islands.length - 1; idx >= 0; idx--) {
    const i = islands[idx];
    if (i.isGinaBar) {
      const sx = screenX(i.wx);
      if (sx < -i.w - buffer) { islands.splice(idx, 1); ginaActive = false; }
    }
  }

  if (!ginaActive && ginaIslandCounter >= 50) {
    spawnGinaIsland();
  }

  for (let b = boats.length - 1; b >= 0; b--) {
    const sx = screenX(boats[b].wx);
    if (sx < -100) boats.splice(b, 1);
  }
}

function render() {
  ctx.clearRect(0, 0, W, H);
  drawSky();
  for (const c of farClouds) drawCloud(c, true);
  drawHaze();
  drawSea();
  for (const i of islands) drawIsland(i);
  for (const i of islands) if (i.isGinaBar) drawHotelAdriano(i);
  for (const b of boats) drawBoat(b);
  for (const c of nearClouds) { const cloudBot = c.y + 30 * c.scale; if (cloudBot < planeY - 15) drawCloud(c, false); }
  drawPlane();
  for (const c of nearClouds) { const cloudBot = c.y + 30 * c.scale; if (cloudBot >= planeY - 15) drawCloud(c, false); }
  drawJoystick();
  drawCredits();
}

let audioStarted = false;
let audioCtx, engineGain, engineOsc1, engineOsc2;
let muted = false;

// Credits overlay: auto-shows once after CREDITS_DELAY, fades after a few
// seconds; C re-triggers the fade cycle anytime
let elapsed = 0;
let creditsT = -1;
let creditsAutoShown = false;
const CREDITS_DELAY = 30;
const CREDITS_IN = 0.8, CREDITS_HOLD = 3.2, CREDITS_OUT = 1.2;

const muteBtn = document.getElementById('mute');
muteBtn.addEventListener('click', () => {
  muted = !muted;
  muteBtn.classList.toggle('muted', muted);
  if (engineGain) engineGain.gain.value = muted ? 0 : currentVol();
});
muteBtn.addEventListener('touchend', e => e.stopPropagation());

function currentVol() {
  const base = W > 768 ? 0.12 : 0.25;
  const moving = Math.abs(planeVX) > 5 || Math.abs(planeVY) > 5;
  return moving ? base : base * 0.4;
}

function startAudio() {
  if (audioCtx && audioCtx.state === 'suspended') { audioCtx.resume(); return; }
  if (audioStarted) return;
  audioStarted = true;
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    audioCtx.resume();
    engineOsc1 = audioCtx.createOscillator(); engineOsc1.type = 'sawtooth'; engineOsc1.frequency.value = 75;
    engineOsc2 = audioCtx.createOscillator(); engineOsc2.type = 'triangle'; engineOsc2.frequency.value = 150;
    const filter = audioCtx.createBiquadFilter(); filter.type = 'lowpass'; filter.frequency.value = 300;
    engineGain = audioCtx.createGain(); engineGain.gain.value = 0;
    engineOsc1.connect(filter); engineOsc2.connect(filter); filter.connect(engineGain); engineGain.connect(audioCtx.destination);
    engineOsc1.start(); engineOsc2.start();
  } catch (e) { audioStarted = false; }
}

function updateAudio(dt) {
  if (!audioStarted || !audioCtx || !engineGain) return;
  if (audioCtx.state === 'suspended') { audioCtx.resume(); return; }
  if (muted) { engineGain.gain.value = 0; return; }
  const targetVol = currentVol();
  engineGain.gain.value += (targetVol - engineGain.gain.value) * Math.min(1, dt * 3);
  const speed = Math.sqrt(planeVX*planeVX+planeVY*planeVY);
  if (engineOsc1) engineOsc1.frequency.value = 70 + speed * 0.08;
  if (engineOsc2) engineOsc2.frequency.value = 140 + speed * 0.15;
}

function loop(ts) {
  if (!lastTime) lastTime = ts;
  const dt = Math.min((ts - lastTime) / 1000, 0.05);
  lastTime = ts;
  elapsed += dt;
  if (!creditsAutoShown && elapsed >= CREDITS_DELAY) { creditsAutoShown = true; creditsT = 0; }
  if (creditsT >= 0) {
    creditsT += dt;
    if (creditsT > CREDITS_IN + CREDITS_HOLD + CREDITS_OUT) creditsT = -1;
  }
  handleInput(dt);
  updateWorld(dt);
  updateAudio(dt);
  render();
  requestAnimationFrame(loop);
}

window.addEventListener('keydown', e => {
  if (e.code === 'KeyM') {
    muted = !muted;
    muteBtn.classList.toggle('muted', muted);
    if (engineGain) engineGain.gain.value = muted ? 0 : currentVol();
    return;
  }
  if (e.code === 'KeyF') {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen().catch(() => {});
    return;
  }
  if (e.code === 'KeyG' && !ginaActive) {
    spawnGinaIsland();
    return;
  }
  if (e.code === 'KeyC') { creditsT = 0; return; }
  keys[e.code] = true;
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
  startAudio();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  if (e.touches.length > 0) {
    const t = e.touches[0];
    touch.active = true; touch.startX = t.clientX; touch.startY = t.clientY;
    touch.x = t.clientX; touch.y = t.clientY; touch.id = t.identifier;
  }
  startAudio();
}, { passive: false });

canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  for (let i = 0; i < e.touches.length; i++) {
    if (e.touches[i].identifier === touch.id) { touch.x = e.touches[i].clientX; touch.y = e.touches[i].clientY; break; }
  }
}, { passive: false });

canvas.addEventListener('touchend', e => {
  e.preventDefault();
  let found = false;
  for (let i = 0; i < e.touches.length; i++) { if (e.touches[i].identifier === touch.id) { found = true; break; } }
  if (!found) { touch.active = false; touch.id = null; }
}, { passive: false });

canvas.addEventListener('touchcancel', e => { touch.active = false; touch.id = null; });
canvas.addEventListener('mousedown', () => startAudio());

let resizeTimer = null;
let genW = 0, genH = 0;
window.addEventListener('resize', () => {
  const oldW = W || window.innerWidth, oldH = H || window.innerHeight;
  resize();
  if (oldW && oldH) { planeX = planeX * (W/oldW); planeY = planeY * (H/oldH); }
  // Refresh viewport-dependent layout (counts, cloud bands) once resizing
  // settles; worldOffset is preserved so the scene doesn't jump.
  // Skips trivial resizes (mobile toolbar flicker) to avoid scenery pops.
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    if (Math.abs(W - genW) > 40 || Math.abs(H - genH) > 40) generateWorld();
  }, 200);
});

init();
requestAnimationFrame(loop);
</script>
</body>
</html>
