services:
  caddy:
    image: caddy:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./games:/srv:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - ACTIVE_GAME=porco
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
