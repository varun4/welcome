<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000}
iframe{display:block;width:100%;height:100%;border:none}
.loading{display:flex;align-items:center;justify-content:center;height:100%;color:#888;font-family:sans-serif;font-size:14px}
</style>
</head>
<body>
<div class="loading" id="loader">Loading...</div>
<iframe id="frame" style="display:none"></iframe>
<script>
const CONFIG = { "active": "porco" };
const page = CONFIG.active;
const frame = document.getElementById('frame');
const loader = document.getElementById('loader');
frame.src = '/' + page + '/index.html';
frame.onload = () => { loader.style.display = 'none'; frame.style.display = 'block'; };
frame.onerror = () => { loader.textContent = 'Page not found: ' + page; };
</script>
</body>
</html>
